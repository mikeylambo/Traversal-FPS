name: Temporary Traversal audio import

on:
  push:
    branches:
      - automation/audio-import-temp

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/audio-import-temp
          fetch-depth: 0

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Apply audio and settings pass
        run: python3 scripts/_audio_import_temp.py

      - name: Audit audio map
        run: npx --yes tsx scripts/audio-doctor.ts --emit-map

      - name: Remove temporary import plumbing
        run: |
          rm -rf .audio-import-temp
          rm scripts/_audio_import_temp.py
          rm .github/workflows/audio-import-temp.yml

      - name: Commit imported assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add movement foley, platform audio and Construct ambience"
          git push origin HEAD:automation/audio-import-temp
