name: Temporary settings repair

on:
  push:
    branches:
      - automation/audio-import-temp

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/audio-import-temp
          fetch-depth: 0

      - name: Repair generated settings output
        run: python3 scripts/_settings_fix_temp.py

      - name: Validate settings/audio invariants
        run: |
          ! grep -R "SETTINGS_SETTINGS_TABS" src/game
          ! grep -R '?? "display"' src/game/SettingsTabsRuntime.ts src/game/MobileSettingsRuntime.ts
          grep -q 'gain: 0.07' src/audio/TraversalAudioManifest.ts
          npx --yes tsx scripts/audio-doctor.ts --emit-map

      - name: Remove temporary repair plumbing
        run: |
          rm scripts/_settings_fix_temp.py
          rm .github/workflows/settings-fix-temp.yml

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: share settings schema across desktop and mobile"
          git push origin HEAD:automation/audio-import-temp
